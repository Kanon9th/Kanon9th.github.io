<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>动漫鉴赏 - Kanon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f2d3d'/%3E%3Cpath d='M9 17V7l7-2v10' fill='none' stroke='%231abc9c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://miaoda.feishu.cn">
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ============================ */
        /* 动漫鉴赏页 · 沉浸式深色舞台   */
        /* ============================ */

        /* 整页深色：把动漫页做成独立影院氛围 */
        body {
            background:
                radial-gradient(1100px 520px at 12% -8%, rgba(26, 188, 156, 0.12), transparent 60%),
                radial-gradient(900px 460px at 92% -4%, rgba(31, 45, 61, 0.55), transparent 55%),
                #0f1620;
            color: #dbe4ea;
        }

        /* 噪点稍加强，深色下更有胶片质感 */
        body::before {
            opacity: 0.055;
        }

        /* 当前页导航高亮：下划线常驻 */
        .nav-current {
            color: #fff;
        }
        .nav-current::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .anime-hero {
            padding-bottom: 8px;
        }

        /* 主标题：渐变文字 + 更重的字重 */
        .anime-hero .section-title {
            font-weight: 900;
            font-size: 2.15em;
            letter-spacing: 0.02em;
            color: transparent;
            background: linear-gradient(115deg, #f2fbf8 12%, #54d8bd 68%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            border-bottom: none;
            padding-bottom: 6px;
        }

        .anime-hero .section-title::after {
            content: "";
            display: block;
            width: 64px;
            height: 3px;
            margin-top: 12px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .anime-desc {
            color: rgba(219, 228, 234, 0.6);
            font-size: 0.98em;
            margin: -6px 0 0;
        }

        .anime-stage-section {
            display: grid;
            gap: 22px;
            padding-top: 44px;
        }

        /* 深色放映舞台：深邃、聚焦、有光感 */
        .anime-stage {
            background:
                radial-gradient(120% 90% at 50% 0%, rgba(26, 188, 156, 0.07), transparent 58%),
                linear-gradient(165deg, #1a2733, #101820);
            border-radius: 18px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid var(--accent);
            box-shadow: 0 26px 64px rgba(0, 0, 0, 0.38), 0 4px 18px rgba(0, 0, 0, 0.24);
        }

        .anime-stage-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .anime-stage-head .now-label {
            color: rgba(219, 228, 234, 0.5);
            font-size: 0.72em;
            letter-spacing: 0.22em;
        }

        .anime-stage-head .now-title {
            color: #fff;
            font-size: 1.2em;
            font-family: "Noto Serif SC", "PingFang SC", serif;
            font-weight: 700;
            margin-top: 4px;
        }

        /* 画面容器：细腻描边 + 深投影 */
        .video-wrap {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #0a1017;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 视频加载指示：细圆环 + 小字 */
        .video-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(10, 16, 23, 0.55);
            color: rgba(219, 228, 234, 0.7);
            font-size: 0.85em;
            letter-spacing: 0.18em;
            opacity: 0;
            transition: opacity 0.3s var(--ease);
            pointer-events: none;
        }

        .video-loading .ring {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(26, 188, 156, 0.2);
            border-top-color: var(--accent);
            animation: ringSpin 0.9s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .anime-controls {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 20px;
        }

        /* 舞台播放按钮：薄荷绿 + 悬停柔光 */
        .anime-controls .toggle-btn {
            background: var(--accent);
            box-shadow: 0 6px 18px rgba(26, 188, 156, 0.35);
        }

        .anime-controls .toggle-btn:hover {
            background: var(--accent-dark);
            box-shadow: 0 8px 26px rgba(22, 160, 133, 0.45);
        }

        .progress-wrap {
            flex: 1;
            min-width: 0;
        }

        #video-progress {
            width: 100%;
            display: block;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            border-radius: 3px;
            transition: height 0.25s var(--ease);
        }

        #video-progress:hover {
            height: 9px;
        }

        #video-progress::-webkit-progress-bar {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 3px;
        }

        #video-progress::-webkit-progress-value {
            background: linear-gradient(90deg, var(--accent), #6fe3cd);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        #video-progress::-moz-progress-bar {
            background: linear-gradient(90deg, var(--accent), #6fe3cd);
            border-radius: 3px;
        }

        .anime-controls .time-row {
            color: rgba(219, 228, 234, 0.7);
            font-variant-numeric: tabular-nums;
        }

        /* 收藏片段：深色迷你卡片 + 编号 */
        .anime-library {
            background: rgba(255, 255, 255, 0.035);
            border: 1px dashed rgba(219, 228, 234, 0.16);
            border-radius: 16px;
            padding: 26px;
            transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
        }

        .anime-library:hover {
            border-color: rgba(26, 188, 156, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
        }

        .anime-library .playlist-title {
            color: rgba(219, 228, 234, 0.55);
        }

        .anime-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .anime-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 16px;
            border-radius: 10px;
            cursor: pointer;
            color: rgba(219, 228, 234, 0.85);
            font-size: 0.95em;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.25s var(--ease), color 0.25s var(--ease),
                        transform 0.25s var(--ease), border-color 0.25s var(--ease);
        }

        .anime-item .anime-num {
            font-family: "Noto Serif SC", "PingFang SC", serif;
            font-size: 0.82em;
            font-weight: 700;
            color: rgba(219, 228, 234, 0.35);
            letter-spacing: 0.08em;
            transition: color 0.25s var(--ease);
            flex: none;
        }

        .anime-item:hover {
            background: rgba(26, 188, 156, 0.08);
            border-color: rgba(26, 188, 156, 0.35);
            transform: translateY(-2px);
        }

        .anime-item.active {
            background: rgba(26, 188, 156, 0.1);
            border-color: rgba(26, 188, 156, 0.5);
            color: #fff;
            font-weight: 500;
        }

        .anime-item.active .anime-num {
            color: var(--accent);
        }

        .anime-more {
            color: rgba(219, 228, 234, 0.45);
            font-size: 0.85em;
            margin: 16px 0 0;
            text-align: center;
            letter-spacing: 0.06em;
        }

        /* ============================ */
        /* 入场动画：标题 → 舞台 → 列表  */
        /* ============================ */
        .anime-hero,
        .anime-stage,
        .anime-library {
            animation: animeUp 0.7s var(--ease) both;
        }

        .anime-stage {
            animation-delay: 0.1s;
        }

        .anime-library {
            animation-delay: 0.2s;
        }

        @keyframes animeUp {
            from {
                opacity: 0;
                transform: translateY(26px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* 深色页页脚文字转浅色 */
        .site-footer {
            color: rgba(219, 228, 234, 0.45);
        }

        /* 移动端：标题缩小，避免断行太散 */
        @media (max-width: 767px) {
            .anime-hero .section-title {
                font-size: 1.5em;
            }

            .anime-stage {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="site-logo">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M9 17V7l7-2v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Kanon
        </h1>
        <nav class="site-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="index.html#about">关于我</a>
            <a href="index.html#tech">技术分享</a>
            <a href="index.html#contact">联系我</a>
            <a href="index.html#guestbook">留言板</a>
            <a href="anime.html" class="nav-current nav-featured">动漫鉴赏</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="content-section anime-hero">
            <h2 class="section-title">动漫 MAD / AMV 鉴赏</h2>
            <p class="anime-desc">收藏喜欢的动漫片段与混剪，在光影与节奏里，重新遇见那些画面。</p>
        </section>

        <section class="content-section anime-stage-section">
            <!-- 主放映区 -->
            <div class="anime-stage">
                <div class="anime-stage-head">
                    <div>
                        <p class="now-label">正在放映</p>
                        <p class="now-title" id="anime-title">无职转生 · 片段一</p>
                    </div>
                </div>
                <div class="video-wrap">
                    <video id="anime-video" preload="metadata" playsinline>
                        <source src="assets/无职1.mp4" type="video/mp4">
                        您的浏览器不支持视频播放。
                    </video>
                    <div class="video-loading" id="video-loading">
                        <div class="ring"></div>
                        <span>正在加载</span>
                    </div>
                </div>
                <div class="anime-controls">
                    <button id="video-toggle" class="toggle-btn" aria-label="播放或暂停视频" title="播放 / 暂停">
                        <svg id="video-icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M8 5.5v13l11-6.5z" fill="currentColor"/>
                        </svg>
                        <svg id="video-icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none">
                            <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>
                        </svg>
                    </button>
                    <div class="progress-wrap">
                        <progress id="video-progress" value="0" max="1"></progress>
                        <div class="time-row">
                            <span id="video-current">0:00</span>
                            <span id="video-total">--:--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 收藏片段 -->
            <div class="anime-library">
                <p class="playlist-title">收藏片段</p>
                <ul class="anime-list" id="anime-list">
                    <li class="anime-item active" data-src="assets/无职1.mp4" data-title="无职转生 · 片段一">
                        <span class="anime-num">01</span>
                        <span>无职转生 · 片段一</span>
                    </li>
                </ul>
                <p class="anime-more">更多片段持续收录中…</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Kanon · 用代码与音乐记录生活</p>
    </footer>

    <script>
        // ====================================================
        // 动漫鉴赏播放器：播放/暂停 + 进度条 + 片段切换 + 加载指示
        // ====================================================
        const video = document.getElementById('anime-video');
        const toggleBtn = document.getElementById('video-toggle');
        const iconPlay = document.getElementById('video-icon-play');
        const iconPause = document.getElementById('video-icon-pause');
        const progress = document.getElementById('video-progress');
        const timeCurrent = document.getElementById('video-current');
        const timeTotal = document.getElementById('video-total');
        const titleEl = document.getElementById('anime-title');
        const listEl = document.getElementById('anime-list');
        const loadingEl = document.getElementById('video-loading');

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function updateIcon(playing) {
            iconPlay.style.display = playing ? 'none' : 'block';
            iconPause.style.display = playing ? 'block' : 'none';
            toggleBtn.setAttribute('aria-label', playing ? '暂停视频' : '播放视频');
            toggleBtn.title = playing ? '暂停' : '播放';
        }

        function showLoading() { loadingEl.style.opacity = 1; }
        function hideLoading() { loadingEl.style.opacity = 0; }

        // 播放 / 暂停
        toggleBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play().then(() => updateIcon(true)).catch(() => {});
            } else {
                video.pause();
                updateIcon(false);
            }
        });

        // 进度与时间
        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                progress.value = video.currentTime / video.duration;
                timeCurrent.textContent = formatTime(video.currentTime);
            }
        });

        video.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(video.duration);
        });

        video.addEventListener('ended', () => {
            updateIcon(false);
        });

        // 加载指示
        video.addEventListener('loadstart', showLoading);
        video.addEventListener('waiting', showLoading);
        video.addEventListener('canplay', hideLoading);
        video.addEventListener('playing', hideLoading);

        // 点击进度条跳转
        progress.addEventListener('click', (e) => {
            const rect = progress.getBoundingClientRect();
            if (video.duration) {
                video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
            }
        });

        // 片段切换（后续新增片段只需在列表中加一项）
        listEl.querySelectorAll('.anime-item').forEach((item) => {
            item.addEventListener('click', () => {
                const isCurrent = item.classList.contains('active') &&
                    video.src && video.src.indexOf(item.dataset.src) !== -1;
                if (isCurrent) {
                    // 再次点击当前片段：切换播放/暂停
                    if (video.paused) {
                        video.play().then(() => updateIcon(true)).catch(() => {});
                    } else {
                        video.pause();
                        updateIcon(false);
                    }
                    return;
                }

                listEl.querySelectorAll('.anime-item').forEach((i) => {
                    i.classList.toggle('active', i === item);
                });
                titleEl.textContent = item.dataset.title;
                video.src = item.dataset.src;
                video.load();
                progress.value = 0;
                timeCurrent.textContent = '0:00';
                timeTotal.textContent = '--:--';
                showLoading();
                video.play().then(() => updateIcon(true)).catch(() => {});
            });
        });

        // 顶栏滚动后加深阴影（rAF 合并到同一帧）
        const header = document.querySelector('.header');
        function onScrollHeader() {
            requestAnimationFrame(() => {
                header.classList.toggle('scrolled', window.scrollY > 10);
            });
        }
        window.addEventListener('scroll', onScrollHeader, { passive: true });
        onScrollHeader();
    </script>
</body>
</html>
